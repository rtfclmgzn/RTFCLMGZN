name: Resources Refresh

# The Resources page is a lab/model/tooling directory, so it goes stale silently —
# a model gets superseded, a price changes, a product is renamed, and nothing breaks
# loudly enough to notice. Weekly, on Sunday, something checks it against reality.
#
# 07:00 UTC Sunday = 02:00 Central. Deliberately outside the cycle hours so it never
# competes with a publishing run for the same files.
on:
  schedule:
    - cron: "0 7 * * 0"
  workflow_dispatch:

concurrency:
  group: resources-refresh
  cancel-in-progress: false

jobs:
  refresh:
    env:
      # THE AGENT WRITES ITS ONE-SENTENCE SUMMARY HERE. The harness reads it into
      # the ledger row after the run. The agent never touches the ledger itself.
      # A LITERAL PATH, NOT ${{ runner.temp }}.
      # The `runner` context does not exist at job-level `env:` — only inside a
      # step. Using it here is not a warning, it makes the whole file an
      # "Invalid workflow file", and GitHub then refuses to run ANY job in it:
      # "Unrecognized named-value: 'runner'". On 2026-08-15 that silently killed
      # the newsroom cycle, both scans, the evolution run and the resources
      # refresh for eight hours — the site simply stopped publishing, and the
      # only symptom was five runs listed by FILE PATH instead of by name.
      # /tmp is always writable on ubuntu-latest and is outside the repo, so the
      # summary can never be committed by accident.
      RTFC_RUN_SUMMARY: /tmp/rtfc_run_summary.txt
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }

      - uses: astral-sh/setup-uv@v5

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # If the Claude GitHub App is not installed on this repo, uncomment the next
          # line. The action defaults to authenticating as the app; GITHUB_TOKEN is the
          # documented alternative and GitHub provides it to every run automatically.
          # Safe here because nothing in this repo is triggered by push.
          # github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Refresh the Resources directory. You are running unattended; do not ask
            questions.

            1. Read web/data/resources.js and web/data/companies.js to see what the
               directory currently claims — labs, flagship models, tools, prices, links.
            2. Verify the claims that go stale: which model is each lab's current
               flagship, current published pricing, product names, and whether every
               link still resolves. Use WebSearch and WebFetch. Prefer each company's
               own pages over coverage about them.
            3. Update only what is genuinely wrong or outdated. Do not rewrite entries
               that are still correct, and do not pad the directory with new entries
               just to show activity — a diff of nothing is a perfectly good result.
            4. Anything you cannot verify from a real source stays as it is. Never
               replace a sourced fact with a guess, and never invent a price or a
               model name to fill a gap.
            5. Bump the ?b=N cache-buster on every asset tag in web/index.html if you
               changed any file under web/ — the edge serves the old file otherwise
               and the update silently does nothing.
            6. Write ONE sentence describing what changed (or that nothing did) to
               the file named by $RTFC_RUN_SUMMARY, and nothing else:
                 printf '%s' "<your sentence>" > "$RTFC_RUN_SUMMARY"
               Do NOT touch web/data/usage-log-current.js and do NOT run
               log_usage.py yourself. The workflow measures your finished run and
               writes the one ledger row from your sentence after you exit.
            7. Commit and push to main: git pull --rebase origin main first, because
               the hourly scans push to this branch too. On a conflict, stop and leave
               it for a human — never force-push.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,WebSearch,WebFetch"

      # MEASURED USAGE. The agent cannot see its own token accounting, so this
      # step reads the finished transcript and writes the ONE ledger row for the
      # run, using the sentence the agent left in $RTFC_RUN_SUMMARY.
      - name: Log measured usage to the public ledger
        if: always()
        run: |
          python3 newsroom/runner/log_usage.py \
            --agent resources-desk --task-type site --model claude-sonnet-5 \
            --description "Weekly resources refresh (GitHub Actions run ${GITHUB_RUN_ID})"
          git config user.name "rtfclmgzn-pipeline"
          git config user.email "rtfclmgzn@gmail.com"
          git add -u
          git add web/data/usage-log-current.js
          if git diff --cached --quiet; then
            echo "nothing to log"
          else
            git commit -m "ledger: measured usage for resources-desk run ${GITHUB_RUN_ID}"
            git pull --rebase origin main || { git rebase --abort || true; echo "rebase race - ledger rides the next run"; }
            git push origin main || echo "push race - ledger rides the next run"
          fi
