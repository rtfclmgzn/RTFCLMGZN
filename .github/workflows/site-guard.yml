name: Site Guard

# THE STANDING CHECK. Runs on EVERY push to main — including the bots' own —
# and hourly as a backstop. This is the answer to "what do we have all these
# agents for if they don't check": the agents write, and this verifies, every
# single time, with no agent in the verification loop.
#
# Two layers:
#   site_guard.py    — data contracts, cross-surface promises, renderer parity,
#                      ledger honesty, cache-buster integrity. Repairs what is
#                      deterministically repairable (--fix) and pushes it.
#   render_smoke.py  — actually opens every route and every article in a real
#                      browser, plus a deliberately minimal "hostile" record
#                      that catches unguarded field reads before a reader does.
#
# Loop safety: a repair commit is tagged [guard] and this workflow skips any
# push whose head commit carries that tag, so it can never chase its own tail.
on:
  push:
    branches: [main]
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:

concurrency:
  group: site-guard
  cancel-in-progress: true

jobs:
  guard:
    if: "!contains(github.event.head_commit.message, '[guard]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }

      # The sitemap regenerates HERE, hourly, not only on a publish.
      # It had drifted to 151 URLs: every article, and three static pages out of
      # twenty-nine. The whole point of moving off hash routes was that pages
      # become findable, and a sitemap that names none of them delivers none of
      # that. gen_sitemap.py is deterministic and idempotent, so running it every
      # hour costs nothing and closes the gap permanently.
      - name: Repair what is deterministically repairable
        run: |
          python3 newsroom/quality/site_guard.py --fix || true
          python3 newsroom/runner/gen_engine_js.py || true
          python3 newsroom/runner/gen_sitemap.py || true
          git config user.name "rtfclmgzn-pipeline"
          git config user.email "rtfclmgzn@gmail.com"
          # STAGE EVERYTHING TRACKED, THEN THE NEW PATHS.
          # A narrow `git add` list leaves other modified files dirty, and
          # `git pull --rebase` REFUSES to run at all when the tree is dirty:
          # "cannot pull with rebase: You have unstaged changes" -> exit 128 ->
          # the whole run goes red AFTER the agent has already done 30 minutes
          # of work. That killed 2 of the last 8 Newsroom Cycles. `git add -u`
          # stages every tracked modification anywhere in the repo; it is not
          # -A, so it can never sweep up an untracked file by accident.
          git add -u
          git add web/data web/sitemap.xml web/rss.xml
          if git diff --cached --quiet; then
            echo "nothing to repair"
          else
            git commit -m "[guard] repair: stores, ledger ids, sitemap and feed"
            git pull --rebase origin main || { git rebase --abort || true; echo "rebase race - repair rides the next run"; }
            git push origin main || echo "push race - repair rides the next run"
          fi

      - name: Contract + cross-surface checks
        run: python3 newsroom/quality/site_guard.py

      # THE BROWSER IS CACHED, AND THE RENDER PASS IS PUSH-ONLY.
      #
      # Measured 2026-08-15: downloading Chromium on every run was costing more
      # minutes than the checks it enabled, and the hourly cron was re-rendering
      # pages that had not changed since the hour before. Two fixes:
      #
      #   · the browser is cached across runs, so a cache hit is seconds
      #   · the render pass runs on PUSH, not on the schedule
      #
      # Coverage is not reduced by the second one. Every bot write ends in a
      # push, so any data change that could break rendering still triggers a
      # full render pass. The hourly cron keeps doing the data-contract checks,
      # which are the ones that can go stale on their own.
      - name: Cache the browser
        if: github.event_name != 'schedule'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install browser for the render check
        if: github.event_name != 'schedule'
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium

      - name: Render every page, including a hostile minimal record
        if: github.event_name != 'schedule'
        run: python3 newsroom/quality/render_smoke.py

      # A failure here is loud on purpose: the run goes red, and the next
      # newsroom cycle's runbook tells it to read the latest Site Guard result
      # before it writes anything, so the system notices its own breakage
      # without waiting for a human to open GitHub.
      - name: Record the verdict
        if: always()
        run: |
          echo "guard_conclusion=${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Checked at $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # THE ONLY CHECK THAT TOUCHES REALITY.
  #
  # Everything in the job above reads files in this repository. On 2026-08-15
  # every one of them passed, all day, while every page on the live site
  # 308-redirected to the homepage and six whole route families returned 404 to
  # anyone arriving from outside the app. The repo was perfect. The site was
  # not. Nothing in a repo can tell you the difference.
  #
  # So this runs separately, after the deploy, and asks the site the same
  # questions a stranger's browser would. It does not follow redirects: a page
  # that answers 3xx is a page that does not exist, no matter what it
  # eventually resolves to.
  #
  # It never blocks a deploy — the deploy has already happened by the time it
  # can be true. It goes red, loudly, so the failure is discovered by a check
  # instead of by a reader.
  # ---------------------------------------------------------------------
  live:
    needs: guard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }

      # --wait ONLY AFTER A PUSH. On a scheduled run nothing was deployed, so
      # waiting up to seven minutes for the edge to serve "this commit" is seven
      # minutes of paying a runner to sleep, 24 times a day. My bug, measured
      # and removed the same day it shipped.
      - name: Check the published site the way a stranger sees it
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python3 newsroom/quality/live_check.py --wait 420
          else
            python3 newsroom/quality/live_check.py
          fi

      - name: Record the verdict
        if: always()
        run: |
          echo "live_conclusion=${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Live site checked at $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_STEP_SUMMARY"

      # THE STABILITY GATE, MADE COUNTABLE.
      # "Two weeks with no reader-visible breakage" was the stated bar for
      # packaging this as a product, and it was being judged by feel. Only
      # FAILURES are recorded here, so the file is a list of incident dates and
      # "days since the last one" is something you can read at a glance instead
      # of something you argue about. A green run writes nothing, so this never
      # becomes 24 commits a day of noise.
      - name: Log an incident if the live site failed
        if: failure()
        run: |
          git config user.name "rtfclmgzn-pipeline"
          git config user.email "rtfclmgzn@gmail.com"
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) live_check FAILED - run ${{ github.run_id }}" >> newsroom/quality/incidents.log
          # STAGE EVERYTHING TRACKED, THEN THE NEW PATHS.
          # A narrow `git add` list leaves other modified files dirty, and
          # `git pull --rebase` REFUSES to run at all when the tree is dirty:
          # "cannot pull with rebase: You have unstaged changes" -> exit 128 ->
          # the whole run goes red AFTER the agent has already done 30 minutes
          # of work. That killed 2 of the last 8 Newsroom Cycles. `git add -u`
          # stages every tracked modification anywhere in the repo; it is not
          # -A, so it can never sweep up an untracked file by accident.
          git add -u
          git add newsroom/quality/incidents.log
          git commit -m "[guard] incident: live check failed" || exit 0
          git pull --rebase origin main || { git rebase --abort || true; exit 0; }
          git push origin main || true
