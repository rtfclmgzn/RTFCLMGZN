name: Pulse Scan

# Was: Windows Scheduled Task "RTFCLMGZN Pulse Scan" (/sc hourly /mo 3 /st 00:45).
# Kept at the same 3-hour cadence and the same :45 offset.
on:
  schedule:
    - cron: "45 */3 * * *"
  workflow_dispatch:

concurrency:
  group: pulse-scan
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
      - uses: anthropics/claude-code-action@v1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # If the Claude GitHub App is not installed on this repo, uncomment the next
          # line. The action defaults to authenticating as the app; GITHUB_TOKEN is the
          # documented alternative and GitHub provides it to every run automatically.
          # Safe here because nothing in this repo is triggered by push.
          # github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Follow newsroom/runner/pulse-scan-runbook.md exactly, from the repository root.
            You are running unattended.
          claude_args: |
            --model claude-haiku-4-5
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,WebSearch,WebFetch"
