name: social-dispatch

# Posts staged social records around the clock — every 3 hours, offset from
# pulse-scan (:45) and breaking-scan (:15). Articles are generated by the
# 3 daily cycles + hourly breaking scans; THIS is what makes posting follow
# the clock instead of the cycle times, including second-wave records with
# not_before schedules. Safe by design: per-platform caps, cooldowns, and
# store-status dedupe all live in the dispatcher itself.

on:
  schedule:
    - cron: "30 */3 * * *"
  workflow_dispatch:

concurrency:
  group: social-dispatch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Post staged social records
        env:
          RTFC_SOCIAL_SECRETS: ${{ secrets.RTFC_SOCIAL_SECRETS }}
        run: |
          if [ -z "$RTFC_SOCIAL_SECRETS" ]; then
            echo "RTFC_SOCIAL_SECRETS is not set - skipping cleanly."
            echo "Add it: repo Settings > Secrets and variables > Actions >"
            echo "New repository secret, name RTFC_SOCIAL_SECRETS, value ="
            echo "the ENTIRE contents of agents/social/.secrets.json"
            exit 0
          fi
          python3 agents/social/post_social.py --live --verbose

      - name: Commit dispatch status updates
        run: |
          git config user.name "rtfclmgzn-pipeline"
          git config user.email "rtfclmgzn@gmail.com"
          git add web/data/social-posts.js
          if git diff --cached --quiet; then
            echo "no status changes to commit"
            exit 0
          fi
          git commit -m "social: dispatch status updates"
          git pull --rebase origin main || { git rebase --abort; echo "rebase race - statuses ride the next run"; exit 0; }
          git push origin main || echo "push race - statuses ride the next run"
