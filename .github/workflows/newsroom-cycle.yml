name: Newsroom Cycle

# Three cycles a day: 05:00, 11:00 and 17:00 US Central.
#
# Cron is UTC and has NO daylight saving, so these are set for CDT (UTC-5), which is
# what Central is right now. From early November to March, Central goes to UTC-6 and
# these land an hour EARLY (04:00 / 10:00 / 16:00 local). If that matters, shift each
# hour +1 for the winter. Nothing breaks either way — the runbook is idempotent.
on:
  schedule:
    - cron: "0 10 * * *"    # 05:00 Central
    - cron: "0 16 * * *"    # 11:00 Central
    - cron: "0 22 * * *"    # 17:00 Central
  workflow_dispatch:          # lets you run it by hand from the Actions tab

concurrency:
  group: newsroom-cycle       # never two cycles at once
  cancel-in-progress: false

jobs:
  cycle:
    env:
      # THE AGENT WRITES ITS ONE-SENTENCE SUMMARY HERE. The harness reads it into
      # the ledger row after the run. The agent never touches the ledger itself.
      # A LITERAL PATH, NOT ${{ runner.temp }}.
      # The `runner` context does not exist at job-level `env:` — only inside a
      # step. Using it here is not a warning, it makes the whole file an
      # "Invalid workflow file", and GitHub then refuses to run ANY job in it:
      # "Unrecognized named-value: 'runner'". On 2026-08-15 that silently killed
      # the newsroom cycle, both scans, the evolution run and the resources
      # refresh for eight hours — the site simply stopped publishing, and the
      # only symptom was five runs listed by FILE PATH instead of by name.
      # /tmp is always writable on ubuntu-latest and is outside the repo, so the
      # summary can never be committed by accident.
      RTFC_RUN_SUMMARY: /tmp/rtfc_run_summary.txt
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write         # the runbook commits and pushes articles
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }        # full history: the runbook rebases before pushing

      - uses: astral-sh/setup-uv@v5

      - uses: anthropics/claude-code-action@v1
        env:
          # Without this, image generation is impossible on the runner and every
          # article draws from the finite library — which is how the 2026-08-10
          # no-cover / reused-cover incident happened. Set the repo secret.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Social dispatch credentials (§5b): the whole agents/social/.secrets.json
          # content as one secret. Absent -> the dispatcher stays in per-platform
          # dry-run, which is the safe default.
          RTFC_SOCIAL_SECRETS: ${{ secrets.RTFC_SOCIAL_SECRETS }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # If the Claude GitHub App is not installed on this repo, uncomment the next
          # line. The action defaults to authenticating as the app; GITHUB_TOKEN is the
          # documented alternative and GitHub provides it to every run automatically.
          # Safe here because nothing in this repo is triggered by push.
          # github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Follow newsroom/runner/cycle-runbook.md exactly, from the repository root.
            You are running unattended. Do not ask questions; make reasonable calls and
            record them in the usage log the runbook tells you to write.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,WebSearch,WebFetch"

      # SELF-HEALING cover gate (2026-08-13) — same block as breaking-scan.yml;
      # see the comment there for the incident that made audit-only insufficient.
      - name: Cover gate — self-heal, then audit
        if: always()
        run: |
          python3 -m pip install --quiet pillow
          python3 newsroom/runner/ensure_covers.py --fix
          python3 newsroom/runner/gen_sitemap.py
          git config user.name "rtfclmgzn-pipeline"
          git config user.email "rtfclmgzn@gmail.com"
          # STAGE EVERYTHING TRACKED, THEN THE NEW PATHS.
          # A narrow `git add` list leaves other modified files dirty, and
          # `git pull --rebase` REFUSES to run at all when the tree is dirty:
          # "cannot pull with rebase: You have unstaged changes" -> exit 128 ->
          # the whole run goes red AFTER the agent has already done 30 minutes
          # of work. That killed 2 of the last 8 Newsroom Cycles. `git add -u`
          # stages every tracked modification anywhere in the repo; it is not
          # -A, so it can never sweep up an untracked file by accident.
          git add -u
          git add web/assets/img/newsroom web/data/newsroom-articles.js web/sitemap.xml web/rss.xml
          if git diff --cached --quiet; then
            echo "covers already complete - nothing to heal"
          else
            git commit -m "covers: self-heal - synthesized branded covers for coverless articles"
            git pull --rebase origin main || { git rebase --abort || true; echo "rebase race - heal rides the next run"; }
            git push origin main || echo "push race - heal rides the next run"
          fi
          python3 newsroom/runner/verify_covers.py check

      # MEASURED USAGE (2026-08-14). The agent inside the run cannot see its own
      # token accounting, so for months every scheduled run logged 0/0 and the
      # public cost figure froze at $11.48 while the newsroom kept publishing.
      # Measurement belongs to the harness: this reads the run's own transcript
      # and writes the real numbers. If it finds no transcript it writes an
      # explicitly UNMETERED row rather than a silent $0 — the site counts and
      # displays those separately. Never delete this step; if it starts writing
      # unmetered rows, the transcript path changed and log_usage.py needs a new
      # candidate, which its own output will tell you.
      - name: Log measured usage to the public ledger
        if: always()
        run: |
          python3 newsroom/runner/log_usage.py \
            --agent newsroom-cycle --task-type publish --model claude-sonnet-5 \
            --description "Autonomous newsroom cycle (GitHub Actions run ${GITHUB_RUN_ID})"
          git config user.name "rtfclmgzn-pipeline"
          git config user.email "rtfclmgzn@gmail.com"
          # STAGE EVERYTHING TRACKED, THEN THE NEW PATHS.
          # A narrow `git add` list leaves other modified files dirty, and
          # `git pull --rebase` REFUSES to run at all when the tree is dirty:
          # "cannot pull with rebase: You have unstaged changes" -> exit 128 ->
          # the whole run goes red AFTER the agent has already done 30 minutes
          # of work. That killed 2 of the last 8 Newsroom Cycles. `git add -u`
          # stages every tracked modification anywhere in the repo; it is not
          # -A, so it can never sweep up an untracked file by accident.
          git add -u
          git add web/data/usage-log-current.js
          if git diff --cached --quiet; then
            echo "no ledger row written"
          else
            git commit -m "ledger: measured usage for newsroom-cycle run ${GITHUB_RUN_ID}"
            git pull --rebase origin main || { git rebase --abort || true; echo "rebase race - row rides the next run"; }
            git push origin main || echo "push race - row rides the next run"
          fi
